name: Apply Renderer Hotfix

on:
  push:
    branches:
      - agent/bootstrap-foundation
    paths:
      - ".github/workflows/apply-renderer-hotfix.yml"
      - "tools/apply_renderer_ref_hotfix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-foundation
      - name: Patch native renderer source
        run: python tools/apply_renderer_ref_hotfix.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/cpp/src/teknik_terrain_renderer.cpp
          git diff --cached --check
          git commit -m "Fix RenderingDevice managed object ownership"
          git push origin HEAD:agent/bootstrap-foundation
