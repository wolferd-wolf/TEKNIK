name: Android Emulator Diagnostic

on:
  push:
    branches:
      - agent/bootstrap-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknik-emulator-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-emulator-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: /usr/local/bin/godot
      GODOT_CPP_REF: "ba0edfed90512ec64aba51d4295a3e7e30112f86"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld scons git curl unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Install Godot and templates
        run: |
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$GODOT_BIN"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Check out pinned godot-cpp
        run: |
          git init native/godot-cpp
          git -C native/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C native/godot-cpp fetch --depth 1 origin "$GODOT_CPP_REF"
          git -C native/godot-cpp checkout --detach FETCH_HEAD
          test "$(git -C native/godot-cpp rev-parse HEAD)" = "$GODOT_CPP_REF"
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "ndk;28.1.13356709"
      - name: Build x86_64 native extension
        run: |
          export NDK_ROOT="$ANDROID_HOME/ndk/28.1.13356709"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          rustup target add x86_64-linux-android
          cargo build --manifest-path native/rust/Cargo.toml --release --target x86_64-linux-android
          mkdir -p /tmp/godot-api
          (cd /tmp/godot-api && godot --headless --dump-extension-api)
          cp /tmp/godot-api/extension_api.json extension_api.json
          (cd native && ANDROID_NDK_ROOT="$NDK_ROOT" ANDROID_HOME="$ANDROID_HOME" scons -j2 platform=android arch=x86_64 target=template_debug android_api_level=24 custom_api_file="$GITHUB_WORKSPACE/extension_api.json" rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/x86_64-linux-android/release")
          test -s native/bin/libteknik_native.android.template_debug.x86_64.so
      - name: Export emulator APK
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' "export/android/java_sdk_path = \"$JAVA_HOME\"" "export/android/android_sdk_path = \"$ANDROID_HOME\"" > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          godot --headless --path . --export-debug "Android Emulator" build/TEKNIK-emulator-debug.apk
          test -s build/TEKNIK-emulator-debug.apk
          unzip -l build/TEKNIK-emulator-debug.apk | tee build/apk-contents.txt
          grep -q "lib/x86_64/.*teknik_native.*\\.so" build/apk-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: teknik-emulator-apk-${{ github.sha }}
          retention-days: 7
          path: build/TEKNIK-emulator-debug.apk

  diagnose-emulator:
    needs: build-emulator-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: teknik-emulator-apk-${{ github.sha }}
          path: qa
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot, launch and preserve evidence
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            mkdir -p emulator-artifacts
            APK="$(find qa -name TEKNIK-emulator-debug.apk -print -quit)"
            printf 'apk=%s\n' "$APK" | tee emulator-artifacts/verdict.txt
            adb install -r "$APK" > emulator-artifacts/install.txt 2>&1
            INSTALL_STATUS=$?
            adb shell cmd package resolve-activity --brief com.wolferdwolf.teknik > emulator-artifacts/resolved-activity.txt 2>&1
            adb shell dumpsys package com.wolferdwolf.teknik > emulator-artifacts/package.txt 2>&1
            adb logcat -c
            adb shell monkey -p com.wolferdwolf.teknik -c android.intent.category.LAUNCHER 1 > emulator-artifacts/launch.txt 2>&1
            LAUNCH_STATUS=$?
            sleep 90
            PID="$(adb shell pidof com.wolferdwolf.teknik 2>/dev/null | tr -d '\r')"
            printf 'install_status=%s\nlaunch_status=%s\npid=%s\n' "$INSTALL_STATUS" "$LAUNCH_STATUS" "$PID" >> emulator-artifacts/verdict.txt
            adb logcat -d > emulator-artifacts/logcat.txt 2>&1
            adb shell dumpsys activity activities > emulator-artifacts/activity.txt 2>&1
            adb shell dumpsys gfxinfo com.wolferdwolf.teknik > emulator-artifacts/gfxinfo.txt 2>&1
            adb shell getprop > emulator-artifacts/getprop.txt 2>&1
            adb shell dumpsys SurfaceFlinger > emulator-artifacts/surfaceflinger.txt 2>&1
            adb exec-out screencap -p > emulator-artifacts/screenshot.png 2>/dev/null
            if [ -n "$PID" ]; then
              adb shell screenrecord --time-limit 12 /sdcard/teknik-emulator.mp4 >/dev/null 2>&1
              adb pull /sdcard/teknik-emulator.mp4 emulator-artifacts/teknik-emulator.mp4 >/dev/null 2>&1
            fi
            VERDICT=pass
            if [ "$INSTALL_STATUS" -ne 0 ]; then VERDICT=install_failure; fi
            if [ "$LAUNCH_STATUS" -ne 0 ]; then VERDICT=launch_failure; fi
            if [ -z "$PID" ]; then VERDICT=process_exited; fi
            if grep -Eiq 'FATAL EXCEPTION|ANR in com\.wolferdwolf\.teknik|Fatal signal|dlopen failed|cannot locate symbol' emulator-artifacts/logcat.txt; then VERDICT=crash_or_native_load_failure; fi
            printf 'verdict=%s\n' "$VERDICT" | tee -a emulator-artifacts/verdict.txt
            test "$VERDICT" = pass
      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-emulator-diagnostic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: emulator-artifacts/
