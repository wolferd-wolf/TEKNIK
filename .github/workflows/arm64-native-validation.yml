name: TEKNIK Native ARM64 Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknik-native-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: /usr/local/bin/godot
      GODOT_CPP_REF: "ba0edfed90512ec64aba51d4295a3e7e30112f86"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "aarch64"
          uname -a | tee runner-architecture.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld scons git curl unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Godot ARM64
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.arm64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.arm64" "${GODOT_BIN}"
          test "$(file -b "${GODOT_BIN}")" != "*x86-64*"
          godot --version

      - name: Check out pinned godot-cpp
        run: |
          git init native/godot-cpp
          git -C native/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C native/godot-cpp fetch --depth 1 origin "$GODOT_CPP_REF"
          git -C native/godot-cpp checkout --detach FETCH_HEAD
          test "$(git -C native/godot-cpp rev-parse HEAD)" = "$GODOT_CPP_REF"

      - name: Build Rust core on ARM64
        run: |
          set -o pipefail
          mkdir -p artifacts/test-logs /tmp/godot-api
          cargo test --manifest-path native/rust/Cargo.toml --release 2>&1 | tee artifacts/test-logs/rust-unit-arm64.log
          cargo build --manifest-path native/rust/Cargo.toml --release 2>&1 | tee artifacts/test-logs/rust-build-arm64.log

      - name: Build native Godot extension on ARM64
        run: |
          set -o pipefail
          (cd /tmp/godot-api && godot --headless --dump-extension-api) 2>&1 | tee artifacts/test-logs/godot-extension-api-arm64.log
          cp /tmp/godot-api/extension_api.json extension_api.json
          (
            cd native
            scons -j2 \
              platform=linux \
              arch=arm64 \
              target=template_debug \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/release"
          ) 2>&1 | tee artifacts/test-logs/native-linux-arm64-build.log
          test -s native/bin/libteknik_native.linux.template_debug.arm64.so
          file native/bin/libteknik_native.linux.template_debug.arm64.so | tee artifacts/test-logs/native-linux-arm64-file.log
          file native/bin/libteknik_native.linux.template_debug.arm64.so | grep -q 'ARM aarch64'

      - name: Import project and validate scripts
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee artifacts/test-logs/godot-import-arm64.log

      - name: Run ARM64 gameplay tests
        run: |
          set -o pipefail
          run_test() {
            local name="$1"
            local script="$2"
            godot --headless --path . --script "$script" 2>&1 | tee "artifacts/test-logs/${name}-arm64.log"
          }
          run_test native-chunk-parity res://tests/run_native_chunk_parity_tests.gd
          run_test native-worker-integration res://tests/run_native_worker_integration_tests.gd
          run_test core res://tests/run_tests.gd
          run_test stream-budget res://tests/run_stream_budget_tests.gd
          run_test performance-telemetry res://tests/run_performance_telemetry_tests.gd
          run_test chunk-build-pool res://tests/run_chunk_build_pool_tests.gd
          run_test spawn-planner res://tests/run_spawn_planner_tests.gd
          run_test terrain-collision-profile res://tests/run_terrain_collision_profile_tests.gd

      - name: Publish ARM64 validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Native-ARM64-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            runner-architecture.txt
            artifacts/test-logs/
