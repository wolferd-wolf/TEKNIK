name: Apply Vulkan Draw Fix

on:
  push:
    branches:
      - agent/bootstrap-foundation
    paths:
      - ".github/workflows/apply-vulkan-draw-fix.yml"
      - "tools/apply_vulkan_vertex_array_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-foundation
      - name: Apply surgical fixes
        run: python tools/apply_vulkan_vertex_array_fix.py
      - name: Commit corrected renderer and diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/cpp/src/teknik_terrain_renderer.cpp .github/workflows/android-emulator-diagnostic.yml
          git rm .github/workflows/apply-vulkan-draw-fix.yml tools/apply_vulkan_vertex_array_fix.py
          git diff --cached --check
          git commit -m "Fix Vulkan procedural draw and emulator APK handoff"
          git push origin HEAD:agent/bootstrap-foundation
