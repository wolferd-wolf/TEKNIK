name: Native Source Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/source-snapshot.yml"
      - "native/cpp/src/teknik_terrain_renderer.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: teknik-native-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: native/cpp/src/teknik_terrain_renderer.cpp
