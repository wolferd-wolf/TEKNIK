name: TEKNIK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknik-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: /usr/local/bin/godot
      GODOT_CPP_REF: "ba0edfed90512ec64aba51d4295a3e7e30112f86"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: native/rust/target
          key: teknik-rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.toml', 'native/rust/src/**', 'native/rust/include/**') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld scons git curl unzip xvfb ffmpeg \
            libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Install Godot and export templates
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export-templates.tpz
          mkdir -p "/tmp/export-templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/export-templates.tpz -d /tmp/export-templates
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
          rustc --version
          cargo --version

      - name: Check out pinned godot-cpp
        run: |
          git init native/godot-cpp
          git -C native/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C native/godot-cpp fetch --depth 1 origin "$GODOT_CPP_REF"
          git -C native/godot-cpp checkout --detach FETCH_HEAD
          actual_ref="$(git -C native/godot-cpp rev-parse HEAD)"
          test "$actual_ref" = "$GODOT_CPP_REF"
          mkdir -p artifacts
          printf '%s\n' "$actual_ref" | tee artifacts/godot-cpp-commit.txt

      - name: Restore godot-cpp build cache
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/obj
            native/godot-cpp/.sconsign.dblite
          key: teknik-godot-cpp-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/cpp/**', 'native/SConstruct') }}

      - name: Build Rust core and Linux C++ bridge
        run: |
          mkdir -p artifacts /tmp/godot-api
          cargo test --manifest-path native/rust/Cargo.toml --release
          cargo build --manifest-path native/rust/Cargo.toml --release

          (
            cd /tmp/godot-api
            godot --headless --dump-extension-api
          )
          cp /tmp/godot-api/extension_api.json extension_api.json

          (
            cd native
            scons -j2 \
              platform=linux \
              arch=x86_64 \
              target=template_debug \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/release"
          )
          test -s native/bin/libteknik_native.linux.template_debug.x86_64.so
          ldd native/bin/libteknik_native.linux.template_debug.x86_64.so

      - name: Import project with native extension
        run: godot --headless --path . --editor --quit

      - name: Run native parity and deterministic tests
        run: |
          godot --headless --path . --script res://tests/run_native_chunk_parity_tests.gd
          godot --headless --path . --script res://tests/run_native_worker_integration_tests.gd
          godot --headless --path . --script res://tests/run_tests.gd
          godot --headless --path . --script res://tests/run_stream_budget_tests.gd
          godot --headless --path . --script res://tests/run_performance_telemetry_tests.gd
          godot --headless --path . --script res://tests/run_surface_language_tests.gd
          godot --headless --path . --script res://tests/run_world_edit_store_tests.gd
          godot --headless --path . --script res://tests/run_chunk_edit_worker_tests.gd
          godot --headless --path . --script res://tests/run_chunk_build_pool_tests.gd
          godot --headless --path . --script res://tests/run_spawn_planner_tests.gd
          godot --headless --path . --script res://tests/run_world_interaction_tests.gd
          godot --headless --path . --script res://tests/run_block_placement_tests.gd
          godot --headless --path . --script res://tests/run_terrain_collision_profile_tests.gd
          godot --headless --path . --script res://tests/run_runtime_log_tests.gd

      - name: Capture rendered QA screenshots
        run: |
          mkdir -p artifacts
          for view in hero river upland; do
            xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy -- \
              --qa-view="$view" \
              --qa-screenshot="artifacts/world-$view.png"
            test -s "artifacts/world-$view.png"
          done

          xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy -- \
            --qa-view="hero" \
            --qa-stream-shift="-1,0" \
            --qa-screenshot="artifacts/world-shifted.png"
          test -s "artifacts/world-shifted.png"

      - name: Record gameplay building test
        run: |
          rm -rf "$HOME/.local/share/godot/app_userdata/TEKNIK/logs"
          rm -f "$HOME/.local/share/godot/app_userdata/TEKNIK/teknik-world-edits.json"
          rm -f "$HOME/.local/share/godot/app_userdata/TEKNIK/teknik-player-state.json"
          xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --fixed-fps 30 \
            --write-movie artifacts/teknik-gameplay.avi -- \
            --qa-gameplay \
            --qa-gameplay-poster=artifacts/gameplay-house.png
          test -s artifacts/teknik-gameplay.avi
          test -s artifacts/gameplay-house.png
          ffmpeg -y -i artifacts/teknik-gameplay.avi \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart \
            artifacts/teknik-gameplay.mp4
          test -s artifacts/teknik-gameplay.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 artifacts/teknik-gameplay.mp4)"
          awk -v value="$duration" 'BEGIN { exit !(value >= 10.0) }'
          test -s "$HOME/.local/share/godot/app_userdata/TEKNIK/logs/teknik-latest.jsonl"
          cp -R "$HOME/.local/share/godot/app_userdata/TEKNIK/logs" artifacts/runtime-logs-building
          rm -f artifacts/teknik-gameplay.avi

      - name: Play across streamed chunk boundaries with no native fallback
        run: |
          rm -rf "$HOME/.local/share/godot/app_userdata/TEKNIK/logs"
          rm -f "$HOME/.local/share/godot/app_userdata/TEKNIK/teknik-world-edits.json"
          rm -f "$HOME/.local/share/godot/app_userdata/TEKNIK/teknik-player-state.json"
          xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --fixed-fps 30 \
            --write-movie artifacts/teknik-playability.avi -- \
            --qa-playability \
            --qa-playability-poster=artifacts/playability-finish.png
          test -s artifacts/teknik-playability.avi
          test -s artifacts/playability-finish.png
          ffmpeg -y -i artifacts/teknik-playability.avi \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart \
            artifacts/teknik-playability.mp4
          test -s artifacts/teknik-playability.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 artifacts/teknik-playability.mp4)"
          awk -v value="$duration" 'BEGIN { exit !(value >= 25.0) }'
          test -s "$HOME/.local/share/godot/app_userdata/TEKNIK/logs/teknik-latest.jsonl"
          cp -R "$HOME/.local/share/godot/app_userdata/TEKNIK/logs" artifacts/runtime-logs-playability
          grep -q '"event":"initial_chunk_built"' artifacts/runtime-logs-playability/teknik-latest.jsonl
          if grep -q '"event":"initial_chunk_fallback"\|"event":"streamed_chunk_fallback"' artifacts/runtime-logs-playability/teknik-latest.jsonl; then
            echo "Native fallback event detected during traversal" >&2
            exit 1
          fi
          rm -f artifacts/teknik-playability.avi

      - name: Publish world preview
        uses: actions/upload-artifact@v4
        with:
          name: teknik-native-world-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/world-*.png
            artifacts/gameplay-house.png
            artifacts/playability-finish.png
            artifacts/teknik-gameplay.mp4
            artifacts/teknik-playability.mp4
            artifacts/runtime-logs-building/
            artifacts/runtime-logs-playability/
            artifacts/godot-cpp-commit.txt

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Cross-compile Rust C++ extension for Android ARM64 and x86_64
        run: |
          export NDK_ROOT="$ANDROID_HOME/ndk/28.1.13356709"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          rustup target add aarch64-linux-android
          cargo build \
            --manifest-path native/rust/Cargo.toml \
            --release \
            --target aarch64-linux-android

          (
            cd native
            ANDROID_NDK_ROOT="$NDK_ROOT" ANDROID_HOME="$ANDROID_HOME" scons -j2 \
              platform=android \
              arch=arm64 \
              target=template_debug \
              android_api_level=24 \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/aarch64-linux-android/release"
          )
          test -s native/bin/libteknik_native.android.template_debug.arm64.so
          file native/bin/libteknik_native.android.template_debug.arm64.so
          readelf -h native/bin/libteknik_native.android.template_debug.arm64.so | tee artifacts/android-native-elf.txt

          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          rustup target add x86_64-linux-android
          cargo build \
            --manifest-path native/rust/Cargo.toml \
            --release \
            --target x86_64-linux-android

          (
            cd native
            ANDROID_NDK_ROOT="$NDK_ROOT" ANDROID_HOME="$ANDROID_HOME" scons -j2 \
              platform=android \
              arch=x86_64 \
              target=template_debug \
              android_api_level=24 \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/x86_64-linux-android/release"
          )
          test -s native/bin/libteknik_native.android.template_debug.x86_64.so
          file native/bin/libteknik_native.android.template_debug.x86_64.so
          readelf -h native/bin/libteknik_native.android.template_debug.x86_64.so | tee artifacts/android-emulator-native-elf.txt

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Android debug APK with native extension
        run: |
          godot --headless --path . --export-debug "Android" build/TEKNIK-debug.apk
          test -s build/TEKNIK-debug.apk
          unzip -l build/TEKNIK-debug.apk | tee artifacts/apk-contents.txt
          grep -q "lib/arm64-v8a/.*teknik_native.*\.so" artifacts/apk-contents.txt

          godot --headless --path . --export-debug "Android Emulator" build/TEKNIK-emulator-debug.apk
          test -s build/TEKNIK-emulator-debug.apk
          unzip -l build/TEKNIK-emulator-debug.apk | tee artifacts/emulator-apk-contents.txt
          grep -q "lib/x86_64/.*teknik_native.*\\.so" artifacts/emulator-apk-contents.txt

      - name: Publish QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-native-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/
            build/*.apk
            native/bin/*.so

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## TEKNIK Rust + C++ native migration QA'
            echo
            echo '- Rust unit tests and exact Godot parity tests executed.'
            echo '- The threaded runtime fails CI if it falls back to GDScript.'
            echo '- All 25 startup safety chunks must use Rust, and the traversal requires native streamed chunks with zero fallback.'
            echo '- Procedural spawn, persistence, placement, collision, logging, house building, and 190-metre traversal remain required.'
            echo '- Rust is linked into one official C++ GDExtension library using a pinned godot-cpp revision.'
            echo '- Android ARM64 and emulator x86_64 exports are rejected unless their native shared libraries are present inside each APK.'
            echo '- The emulator smoke job verifies installation, launch, rendering, process survival, logcat, and Android frame telemetry.'
            echo '- Emulator results are functional Android evidence, not Vivo T3x performance evidence.'
            echo '- Physical Vivo T3x validation remains required after cloud parity and traversal pass.'
          } >> "$GITHUB_STEP_SUMMARY"

  android-emulator-smoke:
    needs: validate-build-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download x86_64 emulator APK
        uses: actions/download-artifact@v4
        with:
          name: teknik-native-${{ github.sha }}
          path: qa

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke-test TEKNIK
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p emulator-artifacts
            APK="$(find qa -name TEKNIK-emulator-debug.apk -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.wolferdwolf.teknik -c android.intent.category.LAUNCHER 1
            sleep 90

            PID="$(adb shell pidof com.wolferdwolf.teknik | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | tee emulator-artifacts/android-emulator-activity.txt
            grep -q "com.wolferdwolf.teknik" emulator-artifacts/android-emulator-activity.txt

            adb exec-out screencap -p > emulator-artifacts/android-emulator.png
            test -s emulator-artifacts/android-emulator.png
            file emulator-artifacts/android-emulator.png

            adb shell screenrecord --time-limit 12 /sdcard/teknik-emulator.mp4
            adb pull /sdcard/teknik-emulator.mp4 emulator-artifacts/teknik-emulator.mp4
            test -s emulator-artifacts/teknik-emulator.mp4

            adb shell dumpsys gfxinfo com.wolferdwolf.teknik > emulator-artifacts/android-emulator-gfxinfo.txt
            adb logcat -d > emulator-artifacts/android-emulator-logcat.txt
            if grep -Eiq "FATAL EXCEPTION|ANR in com\\.wolferdwolf\\.teknik" emulator-artifacts/android-emulator-logcat.txt; then
              echo "Android emulator detected a TEKNIK crash or ANR" >&2
              exit 1
            fi
            test -n "$(adb shell pidof com.wolferdwolf.teknik | tr -d '\r')"

      - name: Publish emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-android-emulator-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: emulator-artifacts/
