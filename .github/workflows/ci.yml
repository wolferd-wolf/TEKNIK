# Production terrain warp must pass procedural, native parity, visual gameplay, and Android export gates.
name: TEKNIK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknik-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  procedural-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: /usr/local/bin/godot

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install procedural preflight runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot-preflight.zip
          unzip -q /tmp/godot-preflight.zip -d /tmp/godot-preflight
          sudo install -m 0755 "/tmp/godot-preflight/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"

      - name: Validate procedural world scripts
        run: |
          set -o pipefail
          mkdir -p artifacts/preflight
          godot --headless --path . --editor --quit 2>&1 | tee artifacts/preflight/project-import.log
          godot --headless --path . --script res://tests/run_procedural_ecology_tests.gd 2>&1 | tee artifacts/preflight/procedural-ecology.log

      - name: Publish procedural preflight failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Procedural-Preflight-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/preflight/

  test-and-build-android:
    needs: procedural-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: /usr/local/bin/godot
      GODOT_CPP_REF: "ba0edfed90512ec64aba51d4295a3e7e30112f86"
      ANDROID_NDK_VERSION: "28.1.13356709"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify single workflow
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/ci.yml

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: native/rust/target
          key: teknik-rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.toml', 'native/rust/src/**', 'native/rust/include/**') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld scons git curl unzip ffmpeg xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Install Godot and export templates
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export-templates.tpz
          mkdir -p "/tmp/export-templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/export-templates.tpz -d /tmp/export-templates
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Check out pinned godot-cpp
        run: |
          git init native/godot-cpp
          git -C native/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C native/godot-cpp fetch --depth 1 origin "$GODOT_CPP_REF"
          git -C native/godot-cpp checkout --detach FETCH_HEAD

      - name: Restore godot-cpp build cache
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/obj
            native/godot-cpp/.sconsign.dblite
          key: teknik-godot-cpp-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/cpp/**', 'native/SConstruct') }}

      - name: Build native Linux test bridge
        run: |
          mkdir -p artifacts/test-logs /tmp/godot-api
          cargo test --manifest-path native/rust/Cargo.toml --release
          cargo build --manifest-path native/rust/Cargo.toml --release
          (cd /tmp/godot-api && godot --headless --dump-extension-api)
          cp /tmp/godot-api/extension_api.json extension_api.json
          (
            cd native
            scons -j2 \
              platform=linux \
              arch=x86_64 \
              target=template_debug \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/release"
          )
          test -s native/bin/libteknik_native.linux.template_debug.x86_64.so

      - name: Import project and run essential tests
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/run_mobile_regression_tests.gd
          godot --headless --path . --script res://tests/run_native_chunk_parity_tests.gd
          godot --headless --path . --script res://tests/run_native_worker_integration_tests.gd
          godot --headless --path . --script res://tests/run_tests.gd
          godot --headless --path . --script res://tests/run_stream_budget_tests.gd
          godot --headless --path . --script res://tests/run_collision_stream_scheduler_tests.gd
          godot --headless --path . --script res://tests/run_world_edit_store_tests.gd
          godot --headless --path . --script res://tests/run_chunk_edit_worker_tests.gd
          godot --headless --path . --script res://tests/run_chunk_build_pool_tests.gd
          godot --headless --path . --script res://tests/run_world_interaction_tests.gd
          godot --headless --path . --script res://tests/run_block_placement_tests.gd

      - name: Record automated gameplay
        run: |
          mkdir -p artifacts/gameplay
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            ffmpeg -y -loglevel warning \
              -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 \
              -i "${DISPLAY}.0" -c:v libx264 -preset veryfast -pix_fmt yuv420p \
              artifacts/gameplay/TEKNIK-gameplay.mp4 &
            recorder_pid=$!
            cleanup() {
              kill -INT "$recorder_pid" 2>/dev/null || true
              wait "$recorder_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            godot --path . --rendering-method gl_compatibility --resolution 1280x720 \
              -- --qa-gameplay --qa-gameplay-poster=res://artifacts/gameplay/TEKNIK-gameplay-poster.png \
              2>&1 | tee artifacts/gameplay/gameplay.log
            test -s artifacts/gameplay/TEKNIK-gameplay-poster.png
          '
          test -s artifacts/gameplay/TEKNIK-gameplay.mp4

      - name: Publish gameplay recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Gameplay-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/gameplay/

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android ARM64 dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Build native Android ARM64 extension
        run: |
          export NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          rustup target add aarch64-linux-android
          cargo build --manifest-path native/rust/Cargo.toml --release --target aarch64-linux-android
          (
            cd native
            ANDROID_NDK_ROOT="$NDK_ROOT" ANDROID_HOME="$ANDROID_HOME" scons -j2 \
              platform=android \
              arch=arm64 \
              target=template_debug \
              android_api_level=24 \
              custom_api_file="$GITHUB_WORKSPACE/extension_api.json" \
              rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/aarch64-linux-android/release"
          )
          test -s native/bin/libteknik_native.android.template_debug.arm64.so

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Android debug APK
        run: |
          godot --headless --path . --export-debug "Android ARM64" build/TEKNIK-arm64-debug.apk
          test -s build/TEKNIK-arm64-debug.apk

      - name: Publish phone APK
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Android-ARM64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: build/TEKNIK-arm64-debug.apk
