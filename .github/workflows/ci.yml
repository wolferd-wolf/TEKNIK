name: TEKNIK CI

on:
  push:
    branches:
      - agent/bootstrap-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: teknik-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6
  GODOT_RELEASE: 4.6-stable
  GODOT_BIN: godot
  GODOT_CPP_REF: godot-4.6-stable

jobs:
  procedural-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up job
        run: true
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install procedural preflight runtime
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"
      - name: Validate procedural world scripts
        run: |
          godot --headless --path . --editor --quit
      - name: Publish procedural preflight failure
        if: failure()
        run: echo "Procedural preflight failed"

  test-and-build-android:
    needs: procedural-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up job
        run: true
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify single workflow
        run: test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: native/rust/target
          key: teknik-rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.toml', 'native/rust/src/**', 'native/rust/include/**') }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld scons git curl unzip ffmpeg xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Install Godot and export templates
        run: |
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" --output /tmp/export-templates.tpz
          mkdir -p "/tmp/export-templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/export-templates.tpz -d /tmp/export-templates
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Check out pinned godot-cpp
        run: |
          git init native/godot-cpp
          git -C native/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C native/godot-cpp fetch --depth 1 origin "$GODOT_CPP_REF"
          git -C native/godot-cpp checkout --detach FETCH_HEAD
      - name: Restore godot-cpp build cache
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/obj
            native/godot-cpp/.sconsign.dblite
          key: teknik-godot-cpp-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/cpp/**', 'native/SConstruct') }}
      - name: Build native Linux test bridge
        run: |
          mkdir -p artifacts/test-logs /tmp/godot-api
          cargo test --manifest-path native/rust/Cargo.toml --release
          cargo build --manifest-path native/rust/Cargo.toml --release
          (cd /tmp/godot-api && godot --headless --dump-extension-api)
          cp /tmp/godot-api/extension_api.json extension_api.json
          (cd native && scons -j2 platform=linux arch=x86_64 target=template_debug custom_api_file="$GITHUB_WORKSPACE/extension_api.json" rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/release")
          test -s native/bin/libteknik_native.linux.template_debug.x86_64.so
      - name: Import project and run essential tests
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/run_mobile_regression_tests.gd
          godot --headless --path . --script res://tests/run_multi_lod_tests.gd
          godot --headless --path . --script res://tests/run_native_chunk_parity_tests.gd
          godot --headless --path . --script res://tests/run_native_worker_integration_tests.gd
          godot --headless --path . --script res://tests/run_tests.gd
          godot --headless --path . --script res://tests/run_stream_budget_tests.gd
          godot --headless --path . --script res://tests/run_collision_stream_scheduler_tests.gd
          godot --headless --path . --script res://tests/run_world_edit_store_tests.gd
          godot --headless --path . --script res://tests/run_chunk_edit_worker_tests.gd
          godot --headless --path . --script res://tests/run_chunk_build_pool_tests.gd
          godot --headless --path . --script res://tests/run_world_interaction_tests.gd
          godot --headless --path . --script res://tests/run_block_placement_tests.gd
          godot --headless --path . --script res://tests/run_engineering_progression_tests.gd
          godot --headless --path . --script res://tests/run_kinetic_machine_tests.gd
      - name: Record automated gameplay
        run: |
          mkdir -p artifacts/gameplay
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            ffmpeg -y -loglevel warning -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 -i "${DISPLAY}.0" -c:v libx264 -preset veryfast -pix_fmt yuv420p artifacts/gameplay/TEKNIK-gameplay.mp4 &
            recorder_pid=$!
            cleanup() { kill -INT "$recorder_pid" 2>/dev/null || true; wait "$recorder_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            godot --path . --rendering-method gl_compatibility --resolution 1280x720 -- --qa-gameplay --qa-gameplay-poster=res://artifacts/gameplay/TEKNIK-gameplay-poster.png 2>&1 | tee artifacts/gameplay/gameplay.log
            test -s artifacts/gameplay/TEKNIK-gameplay-poster.png
            grep -q "QA_KINETIC_MACHINE_PASS" artifacts/gameplay/gameplay.log
          '
      - name: Publish gameplay recording
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Gameplay-${{ github.sha }}
          path: artifacts/gameplay
          retention-days: 14
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android ARM64 dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
      - name: Build native Android ARM64 extension
        run: |
          (cd native && scons -j2 platform=android arch=arm64 target=template_debug custom_api_file="$GITHUB_WORKSPACE/extension_api.json" rust_lib_dir="$GITHUB_WORKSPACE/native/rust/target/aarch64-linux-android/release")
      - name: Configure Android export
        run: mkdir -p build/android
      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/android/TEKNIK-arm64-debug.apk
      - name: Publish phone APK
        uses: actions/upload-artifact@v4
        with:
          name: TEKNIK-Android-ARM64-${{ github.sha }}
          path: build/android/TEKNIK-arm64-debug.apk
          retention-days: 30
